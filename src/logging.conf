[loggers]
keys=root,chatapp

[handlers]
keys=fileHandler

[formatters]
keys=sampleFormatter

[logger_root]
level=WARNING
handlers=fileHandler

[logger_chatapp]
level=DEBUG
handlers=fileHandler
qualname=chatapp
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=sampleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=sampleFormatter
args=('app.log', 'a')

[formatter_sampleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
