<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 420px;
            height: 600px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4f46e5;
            color: #fff;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
        }
        #messages {
            list-style: none;
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #messages li {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        #messages li.own {
            align-self: flex-end;
            background: #4f46e5;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        #messages li.other {
            align-self: flex-start;
            background: #e5e7eb;
            color: #111;
            border-bottom-left-radius: 4px;
        }
        #messages li .sender {
            display: block;
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 2px;
        }
        form {
            display: flex;
            border-top: 1px solid #e5e7eb;
            padding: 12px;
            gap: 8px;
        }
        #messageText {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
        }
        #messageText:focus {
            border-color: #4f46e5;
        }
        button {
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">WebSocket Chat — <span id="ws-id"></span></div>
        <ul id="messages"></ul>
        <form onsubmit="sendMessage(event)">
            <input type="text" id="messageText" autocomplete="off" placeholder="Type a message..."/>
            <button>Send</button>
        </form>
    </div>

    <script>
    var ws = new WebSocket(`ws://${window.location.host}/ws`);

    ws.onopen = function() {
        console.log("WebSocket connected");
    };

    ws.onmessage = function(event) {
        var data = JSON.parse(event.data);
        addMessage(data.sender, data.content);
    };

    ws.onclose = function() {
        console.warn("WebSocket connection closed");
    };

    ws.onerror = function(err) {
        console.error("WebSocket error:", err);
    };

    function addMessage(sender, content) {
        var messages = document.getElementById('messages');
        var li = document.createElement('li');

        var senderSpan = document.createElement('span');
        senderSpan.className = 'sender';
        senderSpan.textContent = sender;

        var textNode = document.createTextNode(content);

        li.appendChild(senderSpan);
        li.appendChild(textNode);
        messages.appendChild(li);
        messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage(event) {
        event.preventDefault();

        var input = document.getElementById("messageText");
        var text = input.value.trim();
        if (text === "") return;

        if (ws.readyState !== WebSocket.OPEN) {
            console.warn("Socket not open, cannot send");
            return;
        }

        ws.send(text);
        input.value = '';
    }
</script>
</body>
</html>
